[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_ENV = "preview"
  NPM_FLAGS = "--include=dev"

[context.production.environment]
  SITE_ENV = "production"
  SITE_URL = "https://portfoliorubenalbarracin.netlify.app"

[context.deploy-preview.environment]
  SITE_ENV = "preview"

[context.branch-deploy.environment]
  SITE_ENV = "preview"
